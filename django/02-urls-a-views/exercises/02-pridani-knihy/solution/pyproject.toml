[project]
name = "solution"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]   # migrace generuje Django, nelintujeme je

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]                     # délku řádků hlídá formatter